# getrandom 0.3+ requires an explicit backend cfg on wasm32-unknown-unknown.
# `wasm_js` routes random reads through `crypto.getRandomValues` via wasm-bindgen.
# See: https://docs.rs/getrandom/0.3/getrandom/#webassembly-support
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']
